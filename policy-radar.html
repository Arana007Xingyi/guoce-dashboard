<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924重大政策雷达</title><style>body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#17243a;margin:0}main{max-width:1000px;margin:auto;padding:24px}section,article{background:white;border:1px solid #dce2eb;border-radius:12px;padding:18px;margin:12px 0}#signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}#signals article{margin:0}small{color:#52647b}a{color:#1759a5}select{font:inherit;padding:8px}h1{font-size:26px}</style><main><a href="index.html">← 返回国策红利工作台</a><h1>924 · 重大政策雷达</h1><p>近7日官方政策候选信号。S/A为候选等级，不代表已确认重大利好或买入建议。</p><p id="status" role="status">正在读取数据…</p><section><h2>六大监测维度</h2><div id="signals"></div></section><section><h2>候选事件</h2><label>筛选等级 <select id="filter"><option value="">全部</option><option>S</option><option>A</option></select></label><div id="events"></div></section></main><script>
const el=id=>document.getElementById(id);
const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
let data;
function render(){el('events').replaceChildren();const rows=data.events.filter(e=>!el('filter').value||e.candidate_level===el('filter').value);if(!rows.length)el('events').append(node('p','当前数据中无匹配候选；不代表市场无重大政策。'));for(const e of rows){const a=node('article','');a.append(node('small',e.date+' · '+e.candidate_level+'级候选 · '+e.status),node('h3',e.title),node('p',e.name+'｜'+e.source+'｜匹配词：'+e.matched.join('、')));try{const u=new URL(e.url);if(u.protocol==='https:'){const link=node('a','查看官方原文');link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';a.append(link)}}catch{}el('events').append(a)}}
el('filter').addEventListener('change',()=>{if(data)render()});
fetch('data/policy_radar.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('数据尚未生成');return r.json()}).then(d=>{data=d;const stale=!d.source_updated_at||Date.now()-Date.parse(d.source_updated_at)>86400000;el('status').textContent='生成时间：'+d.updated_at+'｜原始数据：'+(d.source_updated_at||'未知')+(stale?'｜数据可能过期':'')+'｜采集异常来源：'+(d.sources_failed||[]).length;for(const s of d.signals){const a=node('article','');a.append(node('h3',s.name),node('p',s.candidate_level+'级候选 · '+d.events.filter(e=>e.signal===s.id).length+'条'));el('signals').append(a)}render()}).catch(e=>{el('status').textContent='数据未就绪或读取失败：'+e.message});
</script></html>
