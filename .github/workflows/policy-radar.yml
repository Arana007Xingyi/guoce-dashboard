name: Policy radar
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/test_policy_radar.py'
      - 'policy_radar.py'
      - 'finance_policy_sources.py'
      - '.github/workflows/policy-radar.yml'
permissions:
  contents: read
concurrency:
  group: policy-radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile policy_radar.py finance_policy_sources.py
      - run: python -m unittest discover -s tests -p test_policy_radar.py
      - run: python policy_radar.py
      - name: Publish radar data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policy_radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update policy radar data"
          git pull --rebase origin main
          git push origin HEAD:main
