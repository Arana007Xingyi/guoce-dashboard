name: Radar final audit
on:
  pull_request:
    branches: [feature/policy-radar-3.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - run: python radar_final_audit.py
      - run: python policy_radar.py
        if: always()
      - run: python radar_frontend_audit.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-audit
          path: |
            final-audit.json
            frontend-audit.json
            frontend-*.png
            data/policy_radar.json
