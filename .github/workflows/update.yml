
name: Update Official Policies

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      policy_ids:
        description: '手动AI分析的政策编号（复制工作台生成的内容；每次最多5条；留空则仅采集）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect official policies
        run: python collector.py

      - name: Discover official project and funding announcements (no AI)
        run: python project_discovery.py

      - name: Monitor project funding official sources and history (no AI)
        run: python project_monitor.py

      - name: Update official industry monthly time series (no AI)
        run: python industry_history_update.py

      - name: Analyze selected policies with AI (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.policy_ids != '' }}
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          POLICY_IDS: ${{ inputs.policy_ids }}
        run: python analyzer.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policies.json
          if [ -f data/analysis.json ]; then git add data/analysis.json; fi
          if [ -f data/project_monitor.json ]; then git add data/project_monitor.json; fi
          if [ -f data/project_discovery.json ]; then git add data/project_discovery.json; fi
          if [ -f data/industry_history.json ]; then git add data/industry_history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update official policy data"
            git push
          fi
