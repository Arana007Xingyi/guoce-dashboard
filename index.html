
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国策红利工作台 2.0</title>

<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont,
    "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #e8edf7;
  background: #0c111d;
}

* { box-sizing: border-box; }

body { margin: 0; }

header {
  background: #151c2c;
  border-bottom: 1px solid #2b3750;
  padding: 30px 5%;
}

h1 {
  margin: 0;
  font-size: 27px;
}

header p, .muted { color: #a3b1c9; }

main {
  max-width: 1200px;
  margin: auto;
  padding: 26px 4%;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.card, .panel {
  background: #192235;
  border: 1px solid #303f59;
  border-radius: 14px;
  padding: 20px;
}

.card b {
  display: block;
  color: #a4c6ff;
  font-size: 30px;
  margin-bottom: 8px;
}

.card span {
  font-size: 13px;
  color: #b8c5da;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 24px 0;
}

input, select, button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #42516b;
  background: #242f45;
  color: white;
  font: inherit;
}

input {
  flex: 2;
  min-width: 180px;
}

select {
  flex: 1;
  min-width: 140px;
}

button {
  background: #426ca9;
  cursor: pointer;
}

button:hover { background: #5682c2; }

.policy {
  padding: 18px 0;
  border-bottom: 1px solid #344158;
}

.policy h3 {
  font-size: 16px;
  line-height: 1.6;
  margin: 8px 0;
}

.meta {
  font-size: 12px;
  color: #a7b8d4;
}

.tag {
  display: inline-block;
  padding: 5px 8px;
  margin: 5px 5px 5px 0;
  background: #2c435e;
  border-radius: 5px;
  color: #b8dbff;
  font-size: 12px;
}

a { color: #9fc8ff; }

.notice {
  padding: 15px;
  background: #302b2b;
  border-left: 3px solid #e3b65d;
  border-radius: 6px;
  margin-bottom: 22px;
  font-size: 13px;
  line-height: 1.8;
}

#status {
  font-size: 13px;
  color: #b7c5db;
}

footer {
  text-align: center;
  padding: 30px;
  color: #8291ab;
  font-size: 12px;
}

@media(max-width:700px) {
  .stats {
    grid-template-columns: repeat(2,1fr);
  }
  h1 { font-size: 22px; }
  .card { padding: 14px; }
}
</style>
</head>

<body>

<header>
  <h1>◈ 国策红利工作台 2.0</h1>
  <p>中央政策追踪 · 官方文件溯源 · 产业机会观察</p>
</header>

<main>

<div class="notice">
  本工作台持续追踪中国中央及部委政策。
  政策标题、发布日期和原文链接来自配置的官方栏目。
  产业分类由关键词匹配生成，不代表确定的投资收益。
  所有政策内容请以官方原文为准。
</div>

<section class="stats">
  <div class="card">
    <b id="total">—</b>
    <span>累计收录政策</span>
  </div>
  <div class="card">
    <b id="recent">—</b>
    <span>近30天政策</span>
  </div>
  <div class="card">
    <b id="success">—</b>
    <span>成功数据源</span>
  </div>
  <div class="card">
    <b id="failed">—</b>
    <span>异常数据源</span>
  </div>
</section>

<div class="toolbar">
  <input
    id="search"
    placeholder="搜索政策、发布机构、产业关键词"
    aria-label="搜索政策"
  >

  <select id="topic" aria-label="产业分类">
    <option value="">全部产业</option>
  </select>

  <select id="scope" aria-label="政策层级">
    <option value="">全部层级</option>
    <option value="中央">中央</option>
    <option value="国务院">国务院</option>
    <option value="部委">部委</option>
  </select>

  <button onclick="load()">刷新政策</button>
</div>

<section class="panel">
  <h2>最新政策文件</h2>
  <p id="status">正在读取数据……</p>
  <div id="list"></div>
</section>

<p class="muted">
  官方政策查询：
  <a
    href="https://sousuo.www.gov.cn/zcwjk/"
    target="_blank"
    rel="noopener noreferrer"
  >国务院政策文件库</a>
</p>

</main>

<footer>
  国策红利工作台 2.0 · 官方政策信息研究
</footer>

<script>
let policies = [];

const el = id => document.getElementById(id);

const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]
);

function render() {
  const query = el("search").value.toLowerCase();
  const topic = el("topic").value;
  const scope = el("scope").value;

  const filtered = policies.filter(p => {
    const searchable = [
      p.title,
      p.source,
      ...(p.topics || [])
    ].join(" ").toLowerCase();

    return (
      (!query || searchable.includes(query)) &&
      (!topic || (p.topics || []).includes(topic)) &&
      (!scope || p.scope === scope)
    );
  });

  if (!filtered.length) {
    el("list").innerHTML =
      '<p class="muted">暂无符合条件的政策</p>';
    return;
  }

  el("list").innerHTML = filtered.slice(0, 100).map(p => `
    <article class="policy">
      <div class="meta">
        ${esc(p.date)} ·
        ${esc(p.source)} ·
        ${esc(p.scope)}
      </div>

      <h3>${esc(p.title)}</h3>

      <div>
        ${(p.topics || []).map(t =>
          '<span class="tag">' + esc(t) + '</span>'
        ).join("")}
      </div>

      <a
        href="${esc(p.url)}"
        target="_blank"
        rel="noopener noreferrer"
      >查看官方原文 ↗</a>
    </article>
  `).join("");
}

async function load() {
  el("status").textContent = "正在加载政策数据……";

  try {
    const response = await fetch(
      "./data/policies.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    policies = data.items || [];

    el("total").textContent = policies.length;

    const now = Date.now();
    const thirtyDays = 30 * 86400000;

    el("recent").textContent = policies.filter(p => {
      const timestamp = new Date(
        p.date + "T00:00:00+08:00"
      ).getTime();

      return timestamp <= now &&
        now - timestamp < thirtyDays;
    }).length;

    el("success").textContent =
      (data.sources_ok || []).length;

    el("failed").textContent =
      (data.sources_failed || []).length;

    const topics = [
      ...new Set(
        policies.flatMap(p => p.topics || [])
      )
    ].sort();

    el("topic").innerHTML =
      '<option value="">全部产业</option>' +
      topics.map(t =>
        '<option value="' + esc(t) + '">' +
        esc(t) + '</option>'
      ).join("");

    const updated = data.updated_at
      ? new Date(data.updated_at).toLocaleString(
          "zh-CN",
          { timeZone: "Asia/Shanghai" }
        )
      : "未知";

    const failures =
      (data.sources_failed || []).length;

    el("status").textContent =
      "最近采集时间（北京时间）：" + updated +
      (failures
        ? " · 部分数据源采集失败"
        : " · 数据加载成功");

    render();

  } catch (error) {
    el("status").textContent =
      "无法加载政策数据：" + error.message +
      "。请先在 GitHub Actions 中运行采集任务。";
  }
}

["search", "topic", "scope"].forEach(id => {
  el(id).addEventListener(
    id === "search" ? "input" : "change",
    render
  );
});

load();
</script>

</body>
</html>
